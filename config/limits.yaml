# a page-fetch agent (text was extracted and summarised by a model, not copied
# by hand). Confidence is therefore MEDIUM until cross-checked by a human
# against the page and the account's own console Limits page.
# No API quota was used to produce this file. Nothing here is OBSERVED yet.

sources:
