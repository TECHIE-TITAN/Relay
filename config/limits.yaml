  qwen/qwen3.8-27b:            {rpm: 30, rpd: 1000,  tpm: 8000, tpd: 200000, provenance: DOCUMENTED, plan_label: this-account}
  meta-llama/llama-prompt-guard-2-22m: {rpm: 30, rpd: 14400, tpm: 15000, tpd: 500000, provenance: DOCUMENTED, plan_label: this-account}
  meta-llama/llama-prompt-guard-2-86m: {rpm: 30, rpd: 14400, tpm: 15000, tpd: 500000, provenance: DOCUMENTED, plan_label: this-account}
