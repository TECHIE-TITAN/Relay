  # Their limits are: not stated in what was extracted.

# ---- Counting and semantics -------------------------------------------------
semantics:
  limit_types: [RPM, RPD, TPM, TPD, ASH, ASD, ITPM, OTPM]
  applies_at: organization level, not per user
  binding: "you can hit any limit type depending on which threshold you reach first"
  cached_tokens_count_toward_limits: false      # DOCUMENTED
  max_tokens_counted_up_front: not stated on page
  window_fixed_or_rolling: not stated on page
  requests_in_flight_limit: not stated on page
  failed_or_retried_requests_counted: not stated on page
  limits_may_change_without_notice: not stated on page   # brief says they may; docs say "exceptions"

# ---- Response headers (DOCUMENTED; values on the page are "illustrative") ---
headers:
  retry-after:                  {meaning: seconds, when: "only on 429"}
  x-ratelimit-limit-requests:   {refers_to: RPD, example: 14400}
  x-ratelimit-remaining-requests: {refers_to: RPD, example: 14370}
  x-ratelimit-reset-requests:   {refers_to: RPD, example: "2m59.56s", format: duration string}
  x-ratelimit-limit-tokens:     {refers_to: TPM, example: 18000}
  x-ratelimit-remaining-tokens: {refers_to: TPM, example: 17997}
  x-ratelimit-reset-tokens:     {refers_to: TPM, example: "7.66s", format: duration string}
  consequence: >
    No header reports RPM or TPD. The per-minute request limit can only be
    DOCUMENTED or OBSERVED-TRIGGERED. RPD and TPM can be OBSERVED-REPORTED.

# ---- Errors ------------------------------------------------------------------
errors:
  rate_limit_status: 429
  body_shape: {error: {message: string, type: string}}   # only shape shown
  code_field: not documented
  minute_vs_day_distinguishable: not stated on page
  retry_guidance_for_429: "Implement request throttling and respect rate limits."
  other_codes: {413: too large, 498: flex tier capacity exceeded, 500/502/503: server errors, 424: failed dependency}
  server_errors_billed: false     # "You will not be charged for requests that return server error codes."
  mid_stream_errors: not stated on page

# ---- API shape ---------------------------------------------------------------
api:
  endpoint: https://api.groq.com/openai/v1/chat/completions
  openai_compatible: not stated on the pages read (path suggests it; unconfirmed)
  streaming: {param: stream, terminator: "data: [DONE]"}
  stream_usage_location: not stated on page
  stream_options_include_usage: not stated on page
  nonstream_usage_fields: [queue_time, prompt_tokens, prompt_time, completion_tokens, completion_time, total_tokens, total_time]
  timing_units: not stated (values look like seconds)
  output_limit_param: {preferred: max_completion_tokens, deprecated: max_tokens}
  n: only 1 supported
  seed: best effort, not guaranteed

# ---- Models and notional prices (per 1M tokens, DOCUMENTED) ------------------
models:
  openai/gpt-oss-20b:  {context: 131072, max_completion: 65536, speed_tps: 1000, price_in: 0.075, price_out: 0.30}
  openai/gpt-oss-120b: {context: 131072, max_completion: 65536, speed_tps: 500,  price_in: 0.15,  price_out: 0.60}
  llama-3.1-8b-instant:    {context: 131072, max_completion: 131072, speed_tps: 560, price: "ContactSales on page, no number"}
  llama-3.3-70b-versatile: {context: 131072, max_completion: 32768,  speed_tps: 280, price: "ContactSales on page, no number"}
  qwen/qwen3.8-27b:    {status: preview, context: 131072, max_completion: 16384, price_in: 0.80, price_out: 4.00}
  note: >
    Preview models "may be discontinued at short notice". Free-tier status of
    each model: not stated on the pages read. The text-chat page's example
    comment says "up to 2048 tokens shared between prompt and completion",
    which conflicts with the models table; unreconciled.

